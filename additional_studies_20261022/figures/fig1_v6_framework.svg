<svg xmlns="http://www.w3.org/2000/svg" width="7in" height="3.4in" viewBox="0 0 720 350">
<title>Resource-bound preselection workflow</title>
<desc>Initialization leads to four candidates, analytic ranking and one exact decode. Exact updates either return the archive at the budget endpoint or feed the next candidate pool.</desc>
<defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#485665"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#172a3a;font-size:14px}.head{font-weight:bold;font-size:17px}.small{font-size:13px}.box{stroke:#667b89;stroke-width:1.3;fill:#f5f7f9}.core{stroke:#20648a;stroke-width:1.5;fill:#edf5fa}.flow{fill:none;stroke:#485665;stroke-width:1.6;marker-end:url(#arrow)}</style>
</defs>
<rect width="720" height="350" fill="white"/>
<text x="20" y="22" class="small">Input: instance and evaluation budget or runtime deadline</text>
<rect class="box" x="20" y="42" width="200" height="113" rx="6"/>
<text x="34" y="68" class="head">1  Initialize search</text>
<text x="34" y="94">100 exact evaluations</text>
<text x="34" y="117">45 representatives</text>
<text x="34" y="140">Fixed scales and archive</text>
<rect class="box" x="260" y="42" width="200" height="113" rx="6"/>
<text x="274" y="68" class="head">2  Generate pool</text>
<text x="274" y="94">Shared parent and donor</text>
<text x="274" y="117">Four complete candidates</text>
<text x="274" y="140">Sequence and assignments</text>
<rect class="core" x="500" y="42" width="200" height="113" rx="6"/>
<text x="514" y="68" class="head">3  Scan and select</text>
<text x="514" y="94">Time and energy bounds</text>
<text x="514" y="117">Exact workload range</text>
<text x="514" y="140">Minimum analytic score</text>
<rect class="core" x="500" y="225" width="200" height="105" rx="6"/>
<text x="514" y="252" class="head">4  Decode one</text>
<text x="514" y="278">Synchronize resource clocks</text>
<text x="514" y="302">Charge one exact evaluation</text>
<rect class="box" x="260" y="225" width="200" height="105" rx="6"/>
<text x="274" y="252" class="head">5  Exact updates</text>
<text x="274" y="278">At most two replacements</text>
<text x="274" y="302">Batch archive commits</text>
<rect class="box" x="20" y="225" width="200" height="105" rx="6"/>
<text x="34" y="252" class="head">6  Return archive</text>
<text x="34" y="278">Last archive committed</text>
<text x="34" y="302">within the budget</text>
<path class="flow" d="M220 98 H256"/>
<path class="flow" d="M460 98 H496"/>
<path class="flow" d="M600 155 V221"/>
<text x="610" y="183" class="small">Selected</text>
<text x="610" y="202" class="small">candidate</text>
<path class="flow" d="M500 277 H464"/>
<path class="flow" d="M260 277 H224"/>
<path class="flow" d="M360 225 V159"/>
<text x="369" y="190" class="small">Next iteration</text>
</svg>
